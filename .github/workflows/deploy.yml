name: Deploy demo

on:
  workflow_dispatch:
    inputs:
      provision_accounts:
        description: Run private synthetic account setup from the configured Portal secret slot
        type: boolean
        default: false
      rollback_revision:
        description: Ready, schema-compatible Cloud Run revision to restore
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reject-non-main:
    name: Reject deploy outside main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the main branch
        run: |
          echo '::error::Deploy demo must be run from the main branch.'
          exit 1

  test:
    if: github.ref == 'refs/heads/main' && !inputs.rollback_revision
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' ||
       (inputs.rollback_revision != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
      HABITARC_AUTH_SECRET_VERSION: ${{ vars.HABITARC_AUTH_SECRET_VERSION }}
      HABITARC_ACCOUNTS_SECRET_VERSION: ${{ inputs.provision_accounts && vars.HABITARC_ACCOUNTS_SECRET_VERSION || '' }}
      PROVISION_ACCOUNTS: ${{ inputs.provision_accounts }}
      ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Portal settings and independent reviewer requirement
        shell: bash
        run: |
          [[ "$GCP_PROJECT_ID" == cpe-se-course-2026 && "$GCP_REGION" == asia-southeast1 ]]
          [[ -n "$WIF_PROVIDER" && -n "$WIF_SERVICE_ACCOUNT" ]]
          if [[ "$PROVISION_ACCOUNTS" == true ]]; then
            [[ -z "$ROLLBACK_REVISION" && "$HABITARC_ACCOUNTS_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          fi
          if [[ -z "$ROLLBACK_REVISION" ]]; then
            [[ "$HABITARC_AUTH_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          fi
          # GitHub exposes environment protection rules for this public repository.
          if ! curl --fail --silent --show-error --retry 3 --max-time 15 \
            -H 'Cache-Control: no-cache' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/demo" |
            jq -e '.can_admins_bypass == false and any(.protection_rules[]; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length) > 0)' > /dev/null; then
            echo '::error::The demo environment must require an independent reviewer, prevent self-review, and disable administrator bypass.'
            exit 1
          fi

      - name: Download the tested release image
        if: inputs.rollback_revision == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}/release-image

      - name: Authenticate with the Portal's GitHub OIDC identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 548.0.0

      - name: Release Habitarc on the assigned service
        run: bash deploy/release.sh "$RUNNER_TEMP/release-image/habitarc-image.tar"
