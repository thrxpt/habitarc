services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: habitarc
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "habitarc",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
